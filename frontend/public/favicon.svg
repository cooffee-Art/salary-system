<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="员工管理系统">
  <defs>
    <linearGradient id="edge" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff" />
      <stop offset="0.5" stop-color="#2b6cff" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="core" x1="21" y1="21" x2="43" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9feff" />
      <stop offset="1" stop-color="#00d9e8" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="0.62" stop-color="#8a2be2" stop-opacity="0.16" />
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 深色底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#050811" />
  <circle cx="32" cy="32" r="27" fill="url(#halo)" />

  <!-- 电路引脚 -->
  <g stroke="#00f0ff" stroke-opacity="0.42" stroke-width="1.6" stroke-linecap="round">
    <path d="M32 10V6" />
    <path d="M32 54v4" />
    <path d="M13 32H6" />
    <path d="M51 32h7" />
  </g>
  <g fill="#a855f7">
    <circle cx="32" cy="6" r="1.8" />
    <circle cx="32" cy="58" r="1.8" />
    <circle cx="6" cy="32" r="1.8" />
    <circle cx="58" cy="32" r="1.8" />
  </g>

  <!-- 六边形芯片外壳（青→蓝→紫渐变 + 发光） -->
  <path
    d="M32 9.5 51 19.75v24.5L32 54.5 13 44.25v-24.5z"
    fill="rgba(0, 240, 255, 0.05)"
    stroke="url(#edge)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- 内核菱形（呼应登录页品牌标记） -->
  <path d="M32 20.5 43.5 32 32 43.5 20.5 32z" fill="url(#core)" filter="url(#glow)" />
  <path d="M32 26 38 32 32 38 26 32z" fill="#050811" />
  <circle cx="32" cy="32" r="2.1" fill="#eafeff" filter="url(#glow)" />
</svg>
